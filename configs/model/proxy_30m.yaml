# Proxy scale for fast hyper-parameter sweeps: ~30M total params.
# Same GQA family (4:1 query:kv), head_dim 64. With the 32768 tied vocab:
#   embedding    = 32768 * 512                    = 16,777,216
#   non-embedding= 5 * (2.5*512^2 + 3*512*1408 + 2*512) + 512 = 14,095,872
#   total        = 30,873,088  (~30.87M, +2.9% of 30M target)
d_model: 512
n_layers: 5
n_heads: 8
n_kv_heads: 2
d_ff: 1408
vocab_size: 32768
max_seq_len: 2048
rope_theta: 10000.0
norm_eps: 1.0e-5
tie_embeddings: true
