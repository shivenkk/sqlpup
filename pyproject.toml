[project]
name = "sqlpup"
version = "0.1.1"
description = "A small text-to-SQL language model, trained from scratch."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shiven Khurdi", email = "shiven.khurdi@gmail.com" }]
keywords = ["llm", "text-to-sql", "language-model", "nlp", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=3.6",
    "numpy>=2.1",
    "pyyaml>=6.0.2",
    "tokenizers>=0.21",
    "xxhash>=3.5",
    "zstandard>=0.23",
]

[project.optional-dependencies]
train = ["torch>=2.6", "safetensors>=0.4", "transformers>=4.40", "accelerate>=1.1"]
aws = ["boto3>=1.34"]
report = ["tiktoken>=0.9"]
track = ["wandb>=0.17"]
rl = [
    "trl>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/shivenkk/sqlpup"
Repository = "https://github.com/shivenkk/sqlpup"
Issues = "https://github.com/shivenkk/sqlpup/issues"
"Model weights" = "https://huggingface.co/shivenkk/sqlpup-394m-sft-grpo"

[project.scripts]
sqlpup = "sqlpup.cli:main"

[dependency-groups]
# The linter and type checker carry upper bounds: both gate CI, and a major
# release of either reformats files or tightens inference, turning a green
# checkout red without a code change.
dev = [
    "mypy>=1.13,<3",
    "pre-commit>=4.0",
    "accelerate>=1.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8,<0.16",
    "safetensors>=0.4",
    "torch>=2.6",
    "transformers>=4.40",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist is an allowlist, not a denylist: the backend does not read
# .git/info/exclude, so anything not named here (scratch directories, local
# artifact copies, editor state) stays out by default rather than by being
# remembered. Keep this list in sync when a new top-level directory is added.
[tool.hatch.build.targets.sdist]
include = [
    "src/sqlpup",
    "tests",
    "configs",
    "scripts",
    "docs",
    "results",
    "README.md",
    "LICENSE",
    "Makefile",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlpup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/sqlpup", "tests", "scripts"]
warn_unreachable = true
pretty = true

# tiktoken ('report' extra) and trl ('rl' extra) are optional and absent from the
# default dev/CI env, so their imports must be tolerated when missing. Both are
# imported inside a function body, never at module load.
[[tool.mypy.overrides]]
module = [
    "datasets",
    "datasets.*",
    "tokenizers",
    "tokenizers.*",
    "tiktoken",
    "tiktoken.*",
    "safetensors",
    "safetensors.*",
    "transformers",
    "transformers.*",
    "trl",
    "trl.*",
    "wandb",
    "wandb.*",
    "xxhash",
    "zstandard",
]
ignore_missing_imports = true

# The tokenizers package ships partially annotated bindings; its trainer and
# encoder calls are untyped, which strict mode would otherwise reject.
[[tool.mypy.overrides]]
module = ["sqlpup.tokenizer.train", "sqlpup.tokenizer.fertility"]
disallow_untyped_calls = false

# trl re-exports its trainers through a module __getattr__, so `from trl import
# GRPOConfig` needs an attr-defined ignore when trl IS installed. With the 'rl'
# extra absent the module resolves to Any and that ignore becomes unnecessary,
# which strict mode would then flag as unused. Both states are legitimate, so
# unused-ignore is not enforced for these two modules.
[[tool.mypy.overrides]]
module = ["sqlpup.rl.setup", "sqlpup.rl.train"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end runs that train a real model (deselect with -m 'not slow')"]
filterwarnings = [
    # torch>=2.x emits this DeprecationWarning from torch.jit on first use; it is
    # external and out of our control. Scoped to this exact message so our own
    # code's warnings still surface as warnings.
    'ignore:`torch\.jit\.script_method` is deprecated:DeprecationWarning',
]

[tool.coverage.run]
source = ["src"]
